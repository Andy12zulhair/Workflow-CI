name: MLflow CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  train_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install MLflow and dependencies
        run: pip install mlflow pandas scikit-learn

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Commit Saved Artifact to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/saved_model
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: save re-trained model artifacts [skip ci]"
          git push

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image with MLflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd MLProject
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/diabetes-risk-model:latest"
          mlflow models build-docker -m saved_model -n $IMAGE_NAME
          docker push $IMAGE_NAME
