name: MLflow CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn python-dotenv

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          RUN_ID=$(python -c "import mlflow; client = mlflow.tracking.MlflowClient(); runs = client.search_runs(experiment_ids=['0'], order_by=['start_time DESC'], max_results=1); print(runs[0].info.run_id if runs else 'latest')")
          echo "Latest MLflow Run ID: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          echo "Environment dependencies verified."

      - name: Upload to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/model_backup
          cp -r MLProject/saved_model/* /tmp/model_backup/
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/model_backup/* MLProject/saved_model/
          git add MLProject/saved_model
          git diff --staged --quiet || {
            git commit -m "chore: save re-trained model artifacts [skip ci]"
            git push origin main
          }

      - name: Build Docker Model
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd MLProject
          mlflow models build-docker -m saved_model -n diabetes-risk-model --env-manager local || {
            echo "Fallback: generating Dockerfile with local environment..."
            mlflow models generate-dockerfile -m saved_model -d docker_dir --env-manager local
            docker build -t diabetes-risk-model:latest docker_dir
          }

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag diabetes-risk-model:latest ${{ secrets.DOCKER_USERNAME }}/diabetes-risk-model:latest

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/diabetes-risk-model:latest
